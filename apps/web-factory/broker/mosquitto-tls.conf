# Mosquitto for production (TASK-906, ADR-0023): MQTT over TLS only, on 8883. Same access
# rules as mosquitto.conf (no anonymous access, Dynamic Security, deny by default). Mount
# the server certificate and key (from your CA) at /mosquitto/certs; agents and Web Factory
# verify them with the CA file (ZFACTORY_AGENT_MQTT_CA_FILE, WEB_FACTORY_MQTT_CA_FILE).
# Passwords and Dynamic Security commands then never cross the network in clear.
listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
allow_anonymous false

persistence true
persistence_location /mosquitto/data/

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

max_packet_size 2097152
max_queued_messages 100000
max_queued_bytes 268435456
