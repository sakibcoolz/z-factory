# Mosquitto for Web Factory and its agents (TASK-902, ADR-0019, docs/web-factory.md → Broker).
# Every client signs in; what each may publish and subscribe is Dynamic Security's job.
# On first start, MOSQUITTO_DYNSEC_PASSWORD creates the "admin" client Web Factory uses.
#
# Development and tests listen on plain MQTT behind a loopback port binding. In production,
# replace the listener with TLS (passwords travel in the Dynamic Security commands):
#   listener 8883
#   certfile /mosquitto/certs/server.crt
#   keyfile  /mosquitto/certs/server.key
listener 1883
allow_anonymous false
per_listener_settings false

persistence true
persistence_location /mosquitto/data/

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# A telemetry batch of the largest deployment fits; anything bigger is refused at the door.
max_packet_size 2097152
