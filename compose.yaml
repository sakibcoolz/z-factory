# Local development services only. Factory runtime containers are created by the
# application through the Docker Engine API, never by this file.
name: z-factory-dev

services:
  postgres:
    image: postgres:17
    environment:
      # Development-only credentials; the port is bound to localhost.
      POSTGRES_USER: zfactory
      POSTGRES_PASSWORD: zfactory
      POSTGRES_DB: zfactory
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zfactory -d zfactory"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The process simulation service (ADR-0008, TASK-602): one container for every factory,
  # bound to localhost, with the limits an internal runtime component gets. Started on
  # request: `make start-sim`, or `docker compose --profile sim up -d process-sim` with
  # PROCESS_SIM_TOKEN set. The service itself refuses to start without a token of at least
  # 16 characters; it is not required here, so starting only postgres needs no token (TASK-004).
  process-sim:
    profiles: ["sim"]
    build: ./services/process-sim
    environment:
      PROCESS_SIM_TOKEN: ${PROCESS_SIM_TOKEN:-}
      PROCESS_SIM_MAX_INSTANCES: ${PROCESS_SIM_MAX_INSTANCES:-256}
    ports:
      - "127.0.0.1:${PROCESS_SIM_PORT:-7700}:7700"
    cpus: 1
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
