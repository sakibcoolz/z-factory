name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zfactory
          POSTGRES_PASSWORD: zfactory
          POSTGRES_DB: zfactory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zfactory -d zfactory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://zfactory:zfactory@localhost:5432/zfactory_test
      TEST_DATABASE_URL: postgresql://zfactory:zfactory@localhost:5432/zfactory_test
      TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: services/zfactory-thin-client-agent/go.sum
      - run: npm ci
      # The process simulation service (ADR-0008): formatted, vetted, tested, and built for the harness below.
      - run: test -z "$(gofmt -l .)" && go vet ./... && go test -race ./...
        working-directory: services/process-sim
      - run: go build -o "$RUNNER_TEMP/process-sim" ./cmd/process-sim
        working-directory: services/process-sim
      # The Z-Factory Thin Client Agent (TASK-503): the same gates, the MQTT tests against an
      # eclipse-mosquitto container, and the binary for the edge E2E.
      - run: test -z "$(gofmt -l .)" && go vet ./... && go test -race ./...
        working-directory: services/zfactory-thin-client-agent
        env:
          ZFACTORY_AGENT_DOCKER: "1"
      - run: go build -o "$RUNNER_TEMP/zfactory-agent" ./cmd/zfactory-agent
        working-directory: services/zfactory-thin-client-agent
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:deploy
      # The runner context is not available in the job's env, so the harness binary is named here.
      - run: npm test
        env:
          PROCESS_SIM_BIN: ${{ runner.temp }}/process-sim
          AGENT_BIN: ${{ runner.temp }}/zfactory-agent
      - run: npm run build
      # Web Factory (apps/web-factory, Phase 09): its own install, database, gates and build.
      - name: Web Factory database
        run: PGPASSWORD=zfactory psql -h localhost -U zfactory -d zfactory_test -c "CREATE DATABASE web_factory_test"
      - run: npm ci
        working-directory: apps/web-factory
      - run: npm run lint && npm run typecheck
        working-directory: apps/web-factory
      - run: npm run db:deploy && npm test && npm run build
        working-directory: apps/web-factory
        env:
          WEB_FACTORY_DATABASE_URL: postgresql://zfactory:zfactory@localhost:5432/web_factory_test
          WEB_FACTORY_TEST_DATABASE_URL: postgresql://zfactory:zfactory@localhost:5432/web_factory_test
          AUTH_SECRET: ci-only-auth-secret-0123456789abcdef0123456789
